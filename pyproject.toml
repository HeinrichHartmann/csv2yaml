[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "csv2yaml"
version = "0.1.0"
description = "Universal TSV/CSV to YAML converter with multi-dimensional index support"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "ZAMP Project", email = "noreply@example.com"}
]
keywords = ["csv", "yaml", "tsv", "convert", "multi-index", "matrix"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Filters",
    "Topic :: Utilities",
]

dependencies = [
    "pandas>=1.5.0",
    "pyyaml>=6.0",
    "click>=8.0.0",
    "rich>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=22.0.0",
    "flake8>=5.0.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/zamp-project/csv2yaml"
Repository = "https://github.com/zamp-project/csv2yaml"
Issues = "https://github.com/zamp-project/csv2yaml/issues"

[project.scripts]
csv2yaml = "csv2yaml.cli:main"
tsv2yaml = "csv2yaml.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["csv2yaml"]

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=csv2yaml"
testpaths = ["tests"]

[tool.coverage.run]
source = ["csv2yaml"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
]
